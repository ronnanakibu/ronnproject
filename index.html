    <!-- Prevent theme flash: read localStorage before first paint -->
    <script>
      (function(){
        document.documentElement.classList.remove('no-js');
        var t='paper';
        try{
          var s=localStorage.getItem('theme');
          if(s==='paper'||s==='ember'||s==='matrix')t=s;
          else if(matchMedia('(prefers-color-scheme:dark)').matches)t='ember';
        }catch(e){
          if(matchMedia('(prefers-color-scheme:dark)').matches)t='ember';
        }
        document.documentElement.dataset.theme=t;
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="terminal" class="terminal-window pixel-gui">
      <!-- Retro Arcade Header bar -->
      <header class="terminal-header pixel-hud">
        <div class="hud-left"><span class="hud-blink">●</span> 1P READY</div>
        <div class="hud-center header-domain">ronnproject.my.id</div>
        <div class="hud-right key-hints">CREDITS 99 · STAGE 01</div>
      </header>

      <!-- Terminal body (scrolling history area) -->
      <main class="terminal-body">
        <!-- Pixel Wordmark and intro -->
        <div class="hero-header">
          <h1 class="wordmark pixel-title">RONNPROJECT</h1>
          <div class="arcade-subtag">[ CREATIVE TECHNOLOGIST // INSERT DISK ]</div>
          <p class="intro-text">Mahasiswa Teknik Komputer, Polmed. Membangun sistem dan merancang tampilannya.</p>
        </div>

        <!-- Output area (JS appends command output here) -->
        <div class="output-area" role="log" aria-label="Terminal output"></div>
      </main>

      <!-- Docked bottom block: prompt line + chips -->
      <footer class="terminal-dock">
        <div class="input-area">
          <label for="terminal-input" class="input-prompt">ronn@arcade:~$ </label>
          <span class="input-cursor" aria-hidden="true">█</span>
          <input
            type="text"
            id="terminal-input"
            class="terminal-input"
            placeholder="ketik help atau pilih tombol..."
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          />
        </div>
        <nav class="chip-bar" aria-label="Command shortcuts">
          <span class="chip-bar-label">ACTION:</span>
          <button class="chip pixel-btn" type="button" data-command="help">HELP</button>
          <button class="chip pixel-btn" type="button" data-command="about">ABOUT</button>
          <button class="chip pixel-btn" type="button" data-command="projects">PROJECTS</button>
          <button class="chip pixel-btn" type="button" data-command="contact">CONTACT</button>
          <button class="chip pixel-btn" type="button" data-command="theme">THEME</button>
          <button class="chip pixel-btn" type="button" data-command="clear">CLEAR</button>
        </nav>
      </footer>

      <!-- ARIA live region for screen reader announcements -->
      <div class="sr-live sr-only" aria-live="polite" aria-atomic="false"></div>
    </div>

    <!-- Noscript fallback for search crawlers and JS-disabled browsers -->

          <li><a href="https://squad-x.ronnproject.my.id">squad-x</a> — Pengalaman web sinematik dengan scroll, dibangun di React.</li>
