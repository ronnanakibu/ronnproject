    <!-- Prevent theme flash: read localStorage before first paint -->
    <script>
      (function(){
        document.documentElement.classList.remove('no-js');
        var t='paper';
        try{
          var s=localStorage.getItem('theme');
          if(s==='paper'||s==='ember')t=s;
          else if(matchMedia('(prefers-color-scheme:dark)').matches)t='ember';
        }catch(e){
          if(matchMedia('(prefers-color-scheme:dark)').matches)t='ember';
        }
        document.documentElement.dataset.theme=t;
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <body>
    <div id="terminal" class="terminal-window">
      <!-- Header bar -->
      <header class="terminal-header">

      <!-- Terminal body (scrolling history area) -->

        <!-- Output area (JS appends command output here) -->
        <div class="output-area" role="log" aria-label="Terminal output"></div>

      <!-- Docked bottom block: prompt line + chips -->

            class="terminal-input"
            placeholder="ketik help"
            autocomplete="off"
            autocapitalize="none"

        <nav class="chip-bar" aria-label="Command shortcuts">

          <button class="chip" type="button" data-command="about">about</button>
          <button class="chip" type="button" data-command="projects">projects</button>

          <button class="chip" type="button" data-command="theme">theme</button>
          <button class="chip" type="button" data-command="clear">clear</button>

      <!-- ARIA live region for screen reader announcements -->
